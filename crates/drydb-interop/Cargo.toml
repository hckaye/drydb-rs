[package]
name = "drydb-interop"
description = "Interop harness comparing drydb against the pinned upstream C# implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
drydb = { workspace = true, features = ["zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
drydb-msgpack = { path = "../drydb-msgpack", version = "0.1.0" }
serde_bytes = "0.11"
sha2 = "0.10"

[[bin]]
name = "drydb-oracle-rs"
path = "src/bin/oracle.rs"
