[workspace]
resolver = "2"
members = [
    "crates/drydb",
    "crates/drydb-rkyv",
    "crates/drydb-cli",
    "crates/drydb-async",
    "crates/drydb-msgpack",
    "crates/drydb-interop",
]

[workspace.package]
# The build metadata names the storage format this reads and writes, as
# `libgit2-sys 0.16.2+1.7.2` names the libgit2 it binds. Cargo ignores it when
# resolving, so `drydb = "0.1"` matches.
version = "0.1.0+drydb1.4"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hckaye/drydb-rs"
authors = ["drydb-rs contributors"]

[workspace.dependencies]
drydb = { path = "crates/drydb", version = "0.1.0" }
drydb-rkyv = { path = "crates/drydb-rkyv", version = "0.1.0" }

[profile.bench]
debug = true
